<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Vaan In Sky</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Efek hover untuk interaksi bintang */
        .star-btn:hover ~ .star-btn svg { fill: #D1D5DB; /* Abu-abu */ }
        .star-btn:hover svg, .star-btn-group:hover .star-btn:hover svg ~ svg { fill: #FBBF24; /* Kuning */ }
    </style>
</head>
<body class="bg-white min-h-screen flex flex-col items-center justify-center p-6 text-center">

    <!-- Filter SVG untuk Garis Pinggir Logo (Tidak terlihat di layar, hanya sebagai mesin efek) -->
    <svg width="0" height="0" style="position: absolute;">
      <filter id="garis-pinggir">
        <feMorphology in="SourceAlpha" operator="dilate" radius="1.5" result="tebal"/>
        <feFlood flood-color="#1B3679" result="warna"/>
        <feComposite in="warna" in2="tebal" operator="in" result="garis"/>
        <feMerge>
          <feMergeNode in="garis"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </svg>

    <!-- Logo Cafe dengan Efek Stroke -->
    <img src="{{ url_for('static', filename='images/logo.png') }}" 
         alt="Logo Vaan In Sky" 
         class="h-16 md:h-20 w-auto object-contain mb-8"
         style="filter: url(#garis-pinggir);"> <!-- Ini kode pemanggil stroke-nya -->

    <!-- Teks Sambutan -->
    <h1 class="text-2xl font-bold text-gray-800 mb-2">Terima kasih atas kunjungan Anda!</h1>
    <p class="text-gray-500 mb-8">Bagaimana pengalaman Anda di Vaan In Sky hari ini?</p>

    <!-- 5 Bintang Interaktif -->
    <div class="flex space-x-2 star-btn-group mb-12 flex-row-reverse justify-center">
        <!-- Bintang 5 -->
        <a href="/proses-rating?bintang=5" class="star-btn transition-transform hover:scale-110 peer">
            <svg class="w-12 h-12 text-gray-300 hover:text-yellow-400 fill-current" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
        </a>
        <!-- Bintang 4 -->
        <a href="/proses-rating?bintang=4" class="star-btn transition-transform hover:scale-110 peer">
            <svg class="w-12 h-12 text-gray-300 hover:text-yellow-400 fill-current" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
        </a>
        <!-- Bintang 3 -->
        <a href="/proses-rating?bintang=3" class="star-btn transition-transform hover:scale-110 peer">
            <svg class="w-12 h-12 text-gray-300 hover:text-yellow-400 fill-current" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
        </a>
        <!-- Bintang 2 -->
        <a href="/proses-rating?bintang=2" class="star-btn transition-transform hover:scale-110 peer">
            <svg class="w-12 h-12 text-gray-300 hover:text-yellow-400 fill-current" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
        </a>
        <!-- Bintang 1 -->
        <a href="/proses-rating?bintang=1" class="star-btn transition-transform hover:scale-110 peer">
            <svg class="w-12 h-12 text-gray-300 hover:text-yellow-400 fill-current" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
        </a>
    </div>
